spring:
  application:
    name: military-warehouse-api

  datasource:
    url: jdbc:postgresql://localhost:5432/military_db
    username: military_user
    password: military_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: false

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

info:
  app:
    name: Military Warehouse API
    version: 2.0.0
    stage: Stage 2

logging:
  level:
    ua.edu.viti.military: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: VerySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmSecurity
    expiration-ms: 86400000
